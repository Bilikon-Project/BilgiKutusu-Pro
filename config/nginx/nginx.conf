# BilgiKutusu Pro - Nginx örnek sunucu bloğu.
# Uygulamadan önce portları, yolları ve Kiwix URL kökünü kendi sisteminize göre doğrulayın.
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /var/www/bilgikutusu;
    index bilgikutusu-index.html index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Kiwix --urlRootLocation=/kiwix/ ile başlatılır; prefix upstream'e korunarak iletilir.
    location = /kiwix {
        return 301 /kiwix/;
    }

    location /kiwix/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    location = /kutuphane {
        return 301 /kutuphane/;
    }

    location /kutuphane/ {
        alias /mnt/BilgiKutusu/;
        autoindex off;
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(bak|conf|ini|log|sql|sh|swp|tmp)$ {
        deny all;
    }
}
